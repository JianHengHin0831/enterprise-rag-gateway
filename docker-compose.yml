services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      RAG_QDRANT_URL: http://qdrant:6333
      RAG_REDIS_URL: redis://redis:6379/0
    depends_on:
      qdrant:
        condition: service_started
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs

  qdrant:
    image: qdrant/qdrant:v1.13.0  # bump deliberately; hybrid Query API needs >= 1.10
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional (M3): LangFuse for trace UI
  # langfuse: ...

volumes:
  qdrant_data:
