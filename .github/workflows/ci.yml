name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, tests, offline eval (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.11 = minimum supported, 3.12 = Docker image.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # No `.[embed]`: tests and the offline eval use FakeEmbedder / FakeReranker / FakeLLM,
      # so CI never downloads torch or a model and never calls an LLM.
      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check . --output-format=github

      - name: Ruff format
        run: ruff format --check .

      - name: Validate golden set
        run: python -m evals.run_eval --dry-run

      # Includes the architecture invariants (ACL on every prefetch, cache-key binding,
      # injection wrapping, PII sanitizer, budget reserve/settle) and the English-only check.
      - name: Unit and acceptance tests
        run: pytest tests/ -q

      # Full golden set through /v1/chat with in-memory Qdrant, fakeredis and FakeLLM.
      # Exit code 1 = a hard gate failed (leak, injection, isolation, error).
      - name: Offline eval (hard gates)
        run: python -m evals.run_eval --offline

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: enterprise-rag-gateway:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
