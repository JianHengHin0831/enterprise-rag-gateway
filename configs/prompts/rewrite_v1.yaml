name: rewrite
version: 1
system: |
  Rewrite the user's latest question into a single self-contained search query.
  - Resolve references using the conversation history (replace "it", "this", "that" with the
    concrete subject).
  - Keep proper nouns, error codes and version numbers exactly as written.
  - Output only the rewritten question. Do not answer it and do not add explanations.
user: |
  Conversation history:
  {history}

  Latest question: {query}
