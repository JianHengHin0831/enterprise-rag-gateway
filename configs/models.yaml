# Model registry, routing chains, pricing, resilience settings.
# Prices are USD per 1M tokens, as billed by OpenRouter (https://openrouter.ai/api/v1/models,
# checked 2026-11-19). Re-check them when you change a model; a null price reports
# cost_usd as null.
#
# Every model goes through OpenRouter (one key: RAG_OPENROUTER_API_KEY). To call a vendor
# directly instead, point the model's `provider` at `anthropic` / `dashscope` and use that
# vendor's model id (e.g. claude-sonnet-5-5, qwen-plus).

providers:
  openrouter:
    type: openai_compat
    base_url: https://openrouter.ai/api/v1
    api_key_env: RAG_OPENROUTER_API_KEY
  anthropic:
    type: anthropic
    base_url: https://api.anthropic.com
    api_key_env: RAG_ANTHROPIC_API_KEY
  dashscope:
    type: openai_compat
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api_key_env: RAG_DASHSCOPE_API_KEY
  local:
    type: template  # no network: returns a fixed safe answer

models:
  claude-sonnet:
    provider: openrouter
    model: anthropic/claude-sonnet-5.5
    input_per_mtok: 2.0
    output_per_mtok: 10.0
    timeout_s: 30
    max_output_tokens: 1024
  claude-haiku:
    provider: openrouter
    model: anthropic/claude-haiku-5.5
    input_per_mtok: 0.1
    output_per_mtok: 0.5
    timeout_s: 10
    max_output_tokens: 256
  qwen-plus:
    provider: openrouter
    model: qwen/qwen-plus
    input_per_mtok: 0.26
    output_per_mtok: 0.78
    timeout_s: 30
    max_output_tokens: 1024
  qwen-turbo:
    provider: openrouter
    model: qwen/qwen3.8-flash  # OpenRouter has no qwen-turbo; closest small, cheap Qwen
    input_per_mtok: 0.15
    output_per_mtok: 0.47
    timeout_s: 8
    max_output_tokens: 256
  fallback-template:
    provider: local
    model: fallback-template
    input_per_mtok: 0
    output_per_mtok: 0
    timeout_s: 1
    max_output_tokens: 0

# Ordered fallback chains per task. First entry = primary; anything after it => degraded=true.
routes:
  # claude-haiku first: measured with scripts/bench_rewrite.py via OpenRouter (2026-11-19,
  # 5 calls each) p50 ~1.0 s / max ~1.2 s, vs ~2.8-3.3 s p50 for qwen3.8-flash / qwen3.7-flash.
  rewrite: [claude-haiku, qwen-turbo]
  answer: [claude-sonnet, qwen-plus, fallback-template]

circuit_breaker:
  failure_threshold: 5
  recovery_timeout_s: 30
  half_open_max_calls: 2

retry:
  max_attempts: 3          # per model, before moving down the chain
  base_delay_s: 0.5
  max_delay_s: 4.0
  jitter: full
  request_deadline_s: 15   # total budget across all retries + fallbacks

budget:
  daily_tokens_per_tenant:
    acme_corp: 2000000
    beta_inc: 500000
  on_exceeded: downgrade   # reject | downgrade (route answer -> rewrite-tier model)
