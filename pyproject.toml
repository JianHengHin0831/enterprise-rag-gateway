[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-rag-gateway"
version = "0.1.0"
description = "Multi-tenant, role-isolated RAG gateway with LLM routing, circuit breaking, caching and evals."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "pyjwt>=2.8",
    "qdrant-client>=1.12",
    "redis>=5.0",
    "cachetools>=5.3",
    "tiktoken>=0.7",
]

[project.optional-dependencies]
# Local bge-m3 (dense + sparse). Pulls torch; tests use FakeEmbedder and do not need it.
embed = [
    "FlagEmbedding>=1.3",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "fakeredis>=2.23",
]

[tool.setuptools.packages.find]
include = ["app*", "evals*", "scripts*"]

[tool.setuptools.package-data]
app = ["web/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = [
    # Tests use the in-memory Qdrant, where payload indexes are accepted but inert.
    "ignore:Payload indexes have no effect:UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "SIM"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]  # hard-coded test secrets, seeded RNGs
